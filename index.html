<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>動感車站 · 繁體中文版</title><link rel="stylesheet" href="replica.css?v=1.3.0"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head><body>
<div id="camera"></div><video id="portrait-camera" playsinline muted autoplay hidden></video><div id="original-ui"></div><div id="bubbles"></div>
<section id="safety-screen" aria-labelledby="safety-title" hidden>
 <div class="safety-card">
  <h1 id="safety-title">安全遊玩 AR 的小提醒</h1>
  <ol><li>請和家長一起遊玩。</li><li>請確認周圍沒有危險物品，避免受傷。</li><li>移動前請抬頭，確認周圍安全後再走動。</li></ol>
  <button id="safety-continue" type="button">繼續</button>
 </div>
</section>
<div id="ar-messages"><div id="tracking-note" role="status" hidden>定位不穩，請緩慢移動鏡頭並重新對準辨識圖</div>
<div id="audio-caption" role="status" aria-live="polite" hidden></div></div>
<span id="app-version" aria-label="版本 1.3.0">v1.3.0</span>
<div id="loading" role="status">載入中…</div><div id="orientation">請橫放裝置，使用原版橫向畫面</div>
<dialog id="dialog"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-buttons"></div></dialog>
<input id="face-file" type="file" accept="image/*" hidden><script>
// Keep startup failure handling outside the module graph so import failures are visible.
(function () {
 const loading = document.getElementById('loading');
 let timer;
 const pending = new Set(['啟動程式']);
 function progress(){loading.textContent='載入中…';}
 function fail(error) {
  clearTimeout(timer);
  loading.hidden = false;
  const panel = document.createElement('div');
  const title = document.createElement('p');
  title.textContent = '車站素材未能完成載入';
  const detail = document.createElement('p');
  detail.textContent = error.message || String(error);
  const retry = document.createElement('button');
  retry.textContent = '重新載入';
  retry.onclick = function () { location.reload(); };
  panel.append(title, detail, retry);
  loading.replaceChildren(panel);
 }
 window.stationBoot = {
  track: async function(name,task){
   pending.delete('啟動程式');pending.add(name);progress();
   try{return await task();}catch(error){throw new Error(name+'：'+(error.message||String(error)));}
   finally{pending.delete(name);}
  },
  ready: function () { clearTimeout(timer); loading.hidden = true; },
  fail: fail
 };
 timer = setTimeout(function () {
  fail(new Error('載入超過 30 秒。尚未完成：'+Array.from(pending).join('、')+'。請重新載入。'));
 }, 30000);
 import('./replica.bundle.mjs?v=1.3.0').catch(function (error) {
  fail(new Error('程式載入失敗：' + (error.message || String(error))));
 });
})();
</script></body></html>
